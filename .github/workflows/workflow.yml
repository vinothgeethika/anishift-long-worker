name: Long Anime Cloud Worker Workflow

on:
  repository_dispatch:
    types: [process_long_episode_job, process_long_batch_job]

concurrency:
  group: long-worker-${{ github.event.client_payload.anime_id }}-${{ github.event.client_payload.ep_num || 'batch' }}
  cancel-in-progress: false

jobs:
  process_long_batch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (aria2 & ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 curl ffmpeg mkvtoolnix

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Pip Packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-long-pip-${{ hashFiles('.github/workflows/*.yml', 'workflow.yml') }}
          restore-keys: |
            ${{ runner.os }}-long-pip-

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install google-api-core==2.34.0 tuspy requests-toolbelt torrentool firebase-admin requests python-dotenv pysubs2 deep-translator beautifulsoup4 chardet

      - name: Setup Firebase Credentials
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE_JSON }}
        run: |
          if [ -n "$FIREBASE_JSON" ]; then
            echo "$FIREBASE_JSON" > serviceAccountKey.json
            mkdir -p long_manager
            echo "$FIREBASE_JSON" > long_manager/serviceAccountKey.json
          fi

      - name: Run Cloud Long Anime Worker (4 Parallel Episodes + Subtitles)
        env:
          PYTHONUNBUFFERED: 1
          JOB_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          RPMSHARE_API_TOKEN: ${{ secrets.RPMSHARE_API_TOKEN }}
          RPMSHARE_API_TOKEN_2: ${{ secrets.RPMSHARE_API_TOKEN_2 }}
          GITHUB_TOKEN: ${{ secrets.SUB_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ secrets.SUB_GITHUB_REPO || github.repository }}
          LONG_CONCURRENT_EPISODES: 4
        run: |
          if [ -f "long_manager/long_worker.py" ]; then
            python long_manager/long_worker.py
          else
            python long_worker.py
          fi
